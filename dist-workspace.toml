[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "npm"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Where to host releases
hosting = "github"
# release.yml is generated, then one line is fixed by hand: dist 0.34 renders a local publish job as
# `uses: $/.github/...`. tests/release.rs pins the fix; rerun it after every `dist generate`.
allow-dirty = ["ci"]
# Publish the npm package from CI on release, through npm trusted publishing (no token):
# .github/workflows/publish-npm.yml, given an OIDC id-token below.
publish-jobs = ["./publish-npm"]

[dist.github-custom-job-permissions]
publish-npm = { contents = "read", id-token = "write" }
