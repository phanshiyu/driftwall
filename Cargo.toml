[package]
name = "driftwall"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Architecture drift linter: a Mermaid diagram is the contract, your code must obey it."
license = "MIT"
repository = "https://github.com/phanshiyu/driftwall"
readme = "README.md"
keywords = ["architecture", "linter", "mermaid", "tree-sitter", "ai-agents"]
categories = ["development-tools", "command-line-utilities"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "driftwall"
path = "src/cli/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4.34"
jsonc-parser = { version = "0.34.0", features = ["serde"] }
rayon = "1.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = { version = "1.2.2", default-features = false, features = ["parse", "serde"] }
tree-sitter = "0.27.2"
tree-sitter-bash = "0.25.1"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-swift = "0.7.4"
tree-sitter-typescript = "0.23.2"

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
string_slice = "warn"
as_conversions = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
exit = "warn"
mem_forget = "warn"
allow_attributes_without_reason = "warn"
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
